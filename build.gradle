plugins {
  id "java-gradle-plugin"
  id "org.jetbrains.kotlin.jvm" version "2.4.10"
  id "maven-publish"
  id "com.gradle.plugin-publish" version "2.2.1"
}

group = "one.epicsoft"

gradlePlugin {
  website = "https://gitlab.com/epicsoft-networks/gradle-plugin-depcheck"
  vcsUrl = "https://gitlab.com/epicsoft-networks/gradle-plugin-depcheck.git"
  plugins {
    create("depcheck") {
      id = "one.epicsoft.depcheck"
      displayName = "Epicsoft Dependency Update Checker"
      description = "Reports newer versions of dependencies, Gradle plugins and the Gradle wrapper via deps.dev and optional Maven repositories"
      tags.addAll("dependencies", "dependency-updates", "versions", "version-catalog", "deps.dev")
      implementationClass = "one.epicsoft.gradle.DepsUpdatePlugin"
      compatibility(it) {
        features {
          configurationCache = true
        }
      }
    }
    // Plugin id up to 0.4.1 - still published so existing builds work and find the new releases; logs a warning
    create("depsUpdate") {
      id = "one.epicsoft.deps-update"
      displayName = "Epicsoft Dependency Update Checker (deprecated id, use one.epicsoft.depcheck)"
      description = "Deprecated plugin id of one.epicsoft.depcheck"
      tags.addAll("dependencies", "dependency-updates", "versions", "version-catalog", "deps.dev")
      implementationClass = "one.epicsoft.gradle.LegacyDepsUpdatePlugin"
      compatibility(it) {
        features {
          configurationCache = true
        }
      }
    }
  }
}

java {
  withSourcesJar()
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

dependencies {
  implementation "com.google.code.gson:gson:2.14.0"

  testImplementation platform("org.junit:junit-bom:6.1.3")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testImplementation "org.jetbrains.kotlin:kotlin-test"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
  useJUnitPlatform()
}

publishing {
  repositories {
    if (System.getenv("CI_JOB_TOKEN")) {
      maven {
        name = "gitlab"
        url = "${System.getenv('CI_API_V4_URL')}/projects/${System.getenv('CI_PROJECT_ID')}/packages/maven"
        credentials(HttpHeaderCredentials) {
          name = "Job-Token"
          value = System.getenv("CI_JOB_TOKEN")
        }
        authentication {
          header(HttpHeaderAuthentication)
        }
      }
    }
  }
}
