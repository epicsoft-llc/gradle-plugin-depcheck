stages:
  - build
  - publish

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - chmod +x ./gradlew

build:
  stage: build
  image: epicsoft/openjdk:jdk25
  script:
    - ./gradlew build
  artifacts:
    #### always: the test report is most useful when the build failed
    when: always
    paths:
      - build/libs/*.jar
    reports:
      junit: build/test-results/test/*.xml
    expire_in: 1 week

publish:
  stage: publish
  image: epicsoft/openjdk:jdk25
  needs:
    - job: build
      artifacts: true
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - ./gradlew publish -Pversion=$VERSION
  rules:
    - if: $CI_COMMIT_TAG
