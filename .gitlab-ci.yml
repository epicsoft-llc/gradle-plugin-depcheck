stages:
  - build
  - publish

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

before_script:
  - chmod +x ./gradlew

cache:
  #### Keyed on the dependency files, not the branch: branches and tags share it, a new one only when versions change.
  key:
    files: [ "build.gradle", "gradle/wrapper/gradle-wrapper.properties" ]
    prefix: depcheck-gradle
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

build:
  stage: build
  image: epicsoft/openjdk:jdk25
  script:
    - ./gradlew build
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

publish:
  stage: publish
  image: epicsoft/openjdk:jdk25
  needs:
    - job: build
      artifacts: true
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - ./gradlew publish -Pversion=$VERSION
  rules:
    - if: $CI_COMMIT_TAG
